
name: Build VoidXen Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android Project
        run: |
          mkdir extracted
          unzip -q VoidXenMobileLauncher.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Gradle Project
        id: project
        run: |
          FILE=$(find extracted -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) | head -1)

          if [ -z "$FILE" ]; then
            echo "No settings.gradle found in ZIP"
            exit 1
          fi

          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidXenMobile-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
