
name: Build VoidXen Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e
          FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No Gradle project found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project in: $DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidXenMobile-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
